<script>
/* light or dark: the visitor's choice (shared with the rest of the site through the same key), else the system setting */
(function () {
  var d = document.documentElement, s = null;
  d.classList.add('js');
  try { s = localStorage.getItem('quarto-color-scheme'); } catch (e) {}
  var dark = s ? s === 'alternate' : matchMedia('(prefers-color-scheme: dark)').matches;
  d.dataset.theme = dark ? 'dark' : 'light';
})();
</script>

<style>
/* ---------- palette: first light over a lake, and the same lake at night ---------- */
:root {
  --sky-top: #C3D1D0;  --sky-bot: #E9EDE3;  --glow: rgba(255, 250, 226, .55);
  --bark: #3B3A30;     --bark-dark: #22211A; --bark-lite: #6E694F;  --twig: #7A6C48;
  --stem: #5C775A;
  --leaf-a: #6E8F6B;   --leaf-b: #8FAA83;   --leaf-c: #B4C6A2;  --leaf-d: #A2B46C;  --leaf-e: #557A5A;
  --clay: #D9C8A5;     --ink: #2C2920;
  --text: #2A2B22;     --text-soft: #59604F;
  --focus: #2F5D8A;
  /* the typeface: change it here (and in the <link> above) */
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
:root[data-theme="dark"] {
  --sky-top: #0C171B;  --sky-bot: #1C2D2A;  --glow: rgba(150, 190, 190, .10);
  --bark: #0F1A1C;     --bark-dark: #070D0F; --bark-lite: #2B4642;  --twig: #6F7B55;
  --stem: #5F8C77;
  --leaf-a: #4F7C6B;   --leaf-b: #7BA88E;   --leaf-c: #B4D3B0;  --leaf-d: #93B872;  --leaf-e: #3A6656;
  --clay: #C9B891;     --ink: #1F1B13;
  --text: #DCE6DA;     --text-soft: #9DB2A4;
  --focus: #8FBFEA;
}
@media (prefers-color-scheme: dark) {          /* only used if scripts are off */
  :root:not([data-theme]) {
    --sky-top: #0C171B;  --sky-bot: #1C2D2A;  --glow: rgba(150, 190, 190, .10);
    --bark: #0F1A1C;     --bark-dark: #070D0F; --bark-lite: #2B4642;  --twig: #6F7B55;
    --stem: #5F8C77;
    --leaf-a: #4F7C6B;   --leaf-b: #7BA88E;   --leaf-c: #B4D3B0;  --leaf-d: #93B872;  --leaf-e: #3A6656;
    --clay: #C9B891;     --ink: #1F1B13;
    --text: #DCE6DA;     --text-soft: #9DB2A4;
    --focus: #8FBFEA;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { background: var(--sky-bot); }
body {
  overflow: hidden;
  touch-action: none;               /* a finger drag is wind, not scroll */
  font-family: var(--font);
  color: var(--text);
  background:
    radial-gradient(90vmax 70vmax at 14% -8%, var(--glow), transparent 62%),   /* light coming through the leaves */
    linear-gradient(to bottom, var(--sky-top), var(--sky-bot) 78%);
}

canvas { position: fixed; inset: 0; pointer-events: none; }
#tree  { z-index: 1; }
.js #tree { opacity: 0; transition: opacity 1800ms ease; }
.js #tree.show { opacity: 1; }
.js #tree.instant { transition: none; }

.mist {
  position: fixed; left: 0; right: 0; bottom: 0; height: 28vh; z-index: 2;
  background: linear-gradient(to top, var(--sky-bot) 30%, transparent);
  pointer-events: none;
}

/* name + tagline (home) and back/see-all (inside a branch) share the bottom-left corner */
.id, .crumb {
  position: fixed; z-index: 3;
  left: calc(env(safe-area-inset-left, 0px) + clamp(20px, 4vw, 56px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(20px, 4vh, 44px));
  max-width: min(36rem, calc(100vw - 40px));
}
.id { max-width: min(46rem, calc(100vw - 40px)); text-shadow: 0 0 .55em var(--sky-bot), 0 0 .18em var(--sky-bot); }   /* a halo, so words stay readable over the leaves */
.id::before {                                   /* a soft clearing in the foliage behind the words (fades out fully inside its box) */
  content: ""; position: absolute; z-index: -1; pointer-events: none;
  inset: -5.5rem -6rem -3rem -5rem;
  background: radial-gradient(ellipse 46% 48% at 47% 50%,
    color-mix(in srgb, var(--sky-bot) 95%, transparent) 55%, color-mix(in srgb, var(--sky-bot) 62%, transparent) 80%, transparent 100%);
}
.id .eyebrow { margin: 0 0 .6em; font-size: clamp(13px, .45vw + 11px, 16px); line-height: 1.4; color: var(--text-soft); letter-spacing: .01em; }
.id h1 {
  margin: 0 0 .26em; font-weight: 600; line-height: 1.02; letter-spacing: -.028em;
  font-size: clamp(44px, 6.6vw, 96px);
}
.id .lede { max-width: 36em; margin: 0; line-height: 1.5; font-size: clamp(16px, .55vw + 12px, 20px); }
.id .l2 { margin: .15em 0 0; min-height: 1.5em; line-height: 1.5; font-size: clamp(16px, .55vw + 12px, 20px); font-style: italic; color: var(--text-soft); }
.js .id { opacity: 0; transition: opacity 1000ms ease; }
.js body.on .id { opacity: 1; }
.js body.deep .id { opacity: 0; pointer-events: none; }

.crumb {
  z-index: 6; display: flex; flex-direction: column; align-items: flex-start; gap: .55em;
  font-size: clamp(17px, 1.3vw + 9px, 20px); line-height: 1.35;
  opacity: 0; visibility: hidden; transition: opacity 400ms ease, visibility 0s 400ms;
}
body.crumb-on .crumb { opacity: 1; visibility: visible; transition: opacity 800ms ease; }
.crumb button, .crumb a {
  font: inherit; color: var(--text); background: none; border: 0; padding: 0; margin: 0;
  text-align: left; cursor: pointer;
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .22em;
}
.crumb .quiet { color: var(--text-soft); font-style: italic; text-decoration: none; }
.crumb :focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }

/* links under the last phrase: GitHub, email, CV, LinkedIn (line icons from Feather, MIT) */
.id .links { display: flex; gap: .25rem; margin: .7rem 0 0 -.6rem; }
.id .links a {
  display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
  color: var(--text-soft); transition: color 200ms ease, transform 200ms ease;
}
.id .links a:hover { color: var(--text); transform: translateY(-2px); }
.id .links a:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; color: var(--text); }
.id .links svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.js .id .links { opacity: 0; visibility: hidden; transition: opacity 900ms ease 1500ms, visibility 0s 1500ms; }
.js body.on .id .links { opacity: 1; visibility: visible; }
.js body.on.deep .id .links { opacity: 0; visibility: hidden; transition: opacity 300ms ease, visibility 0s 300ms; }

/* light / dark switch, top right (shares its setting with the other pages) */
.theme {
  display: none; position: fixed; z-index: 6; place-items: center; width: 42px; height: 42px; padding: 0; cursor: pointer;
  top: calc(env(safe-area-inset-top, 0px) + 14px); right: calc(env(safe-area-inset-right, 0px) + 14px);
  color: var(--text); border: 1px solid color-mix(in srgb, var(--text) 20%, transparent); border-radius: 50%;
  background: color-mix(in srgb, var(--sky-bot) 70%, transparent);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  transition: opacity 900ms ease, transform 200ms ease;
}
.js .theme { display: grid; opacity: 0; visibility: hidden; }
.js body.on .theme { opacity: 1; visibility: visible; }
.theme:hover { transform: rotate(18deg); }
.theme:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.theme svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.theme .sun { display: none; }
:root[data-theme="dark"] .theme .sun { display: block; }
:root[data-theme="dark"] .theme .moon { display: none; }

.typing::after {
  content: ""; display: inline-block; width: 1px; height: 1em; margin-left: 2px;
  background: currentColor; vertical-align: -.12em; animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- tablets (Linear B "palm-leaf" tablets) ---------- */
#tablets { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
.js #tablets { visibility: hidden; }
.js body.on #tablets { visibility: visible; }

.tablet {
  position: absolute; left: 0; top: 0; display: block;
  color: var(--ink); text-decoration: none; text-align: center;
  font-size: clamp(14px, 1.1vw + 9px, 19px); line-height: 1.2;
  transform-origin: 50% 0; will-change: transform, opacity;
  filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .18));
  opacity: 0;                        /* JS sets opacity every frame */
}
.tablet::before {                    /* the little ring the strand ties through */
  content: ""; position: absolute; top: -6px; left: 50%; width: 7px; height: 7px;
  margin-left: -3.5px; border: 1.5px solid var(--stem); border-radius: 50%;
}
.slab {
  display: block; max-width: 11.5em; padding: .45em 1.1em .55em; text-wrap: balance;
  clip-path: polygon(6% 0, 94% 0, 100% 50%, 94% 100%, 6% 100%, 0 50%);
  background:
    repeating-linear-gradient(to bottom, transparent 0 .62em, rgba(70, 50, 20, .14) .62em calc(.62em + 1px)),
    var(--clay);
  transition: filter 200ms ease;
}
.tablet:hover .slab, .tablet:focus-visible .slab { filter: brightness(1.08); }
.tablet:focus-visible { outline: 2px solid var(--focus); outline-offset: 5px; }

.ns { position: fixed; top: 24px; left: 24px; display: flex; flex-wrap: wrap; gap: 1.2em; z-index: 6; }
.ns a { color: var(--text); }

@media (prefers-reduced-motion: reduce) { .typing::after { animation: none; } }
</style>

<script>
(() => {
'use strict';

/* =====================================================================
   EDIT ME — everything you'd want to change lives in this block.
   A section with `children` zooms in and grows a new branch when clicked;
   without `children` it simply opens its page. Children can have children too.
   ===================================================================== */
const CONFIG = {
  tree: false,     // false: only the leaves, hanging from the top edge.  true: the trunk and limbs they hang from
  eyebrow: 'MSc Neuroscience · Oldenburg · UZH · ETH Zürich',
  lede: 'I build hierarchical Bayesian models of how the brain tracks naturalistic speech, and I study when evaluations of learned systems, AI included, can actually be trusted.',   // shown at once
  phrases: ['EEG & intracranial recordings', 'hierarchical Bayesian inference', 'prosody & cortical entrainment',
            'Ancient Greek & Linear B', 'probably on a trail somewhere'],   // last one stays on screen
  description: 'Neuroscience student in Oldenburg, Zürich (UZH and ETH). Hierarchical Bayesian models of neural responses to speech, reliable evaluation of learned systems, EEG, Ancient Greek and Linear B.',
  // Icons under the last phrase. An empty `href` hides that icon.
  links: [
    { label: 'GitHub',   icon: 'github',   href: 'https://github.com/ellacapellini', external: true },
    { label: 'Email',    icon: 'mail',     href: 'mailto:ella.capellini@uzh.ch' },
    { label: 'CV (PDF)', icon: 'file',     href: 'cv/Ella-Capellini-CV.pdf', external: true },
    { label: 'LinkedIn', icon: 'linkedin', href: 'https://www.linkedin.com/in/ella-capellini/', external: true },
  ],
  sections: [
    { label: 'Research',  href: 'research/' },
    { label: 'Courses',   href: 'courses/' },
    { label: 'Resources', href: 'resources/' },
    { label: 'Code',      href: 'https://github.com/ellacapellini', external: true },
    { label: 'CV',        href: 'cv/Ella-Capellini-CV.pdf', external: true },   // opens the PDF
  ],
};
/* ===================================================================== */

const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const eio = v => v < .5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2;
const approach = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- colours come from the CSS variables, so light and dark just work ---------- */
const root = document.documentElement, rootStyle = getComputedStyle(root);
let C = {};
function readColors() {
  const g = n => rootStyle.getPropertyValue(n).trim();
  C = { bark: g('--bark'), barkDark: g('--bark-dark'), barkLite: g('--bark-lite'), twig: g('--twig'), stem: g('--stem'),
        text: g('--text'), leaves: ['--leaf-a', '--leaf-b', '--leaf-c', '--leaf-d', '--leaf-e'].map(g) };
  if (stack.length) paintBranches(stack[0]);
}
const stored = () => { try { return localStorage.getItem('quarto-color-scheme'); } catch (e) { return null; } };
function setTheme(dark, remember) {
  root.dataset.theme = dark ? 'dark' : 'light';
  if (remember) { try { localStorage.setItem('quarto-color-scheme', dark ? 'alternate' : 'default'); } catch (e) {} }
  readColors();
}
$('#theme').addEventListener('click', () => setTheme(root.dataset.theme !== 'dark', true));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => { if (stored() === null) setTheme(e.matches, false); });

/* ---------- state ---------- */
const cv = $('#tree'), ctx = cv.getContext('2d'), nav = $('#tablets');
let W = 0, H = 0, DPR = 1, leafK = 1;
const stack = [];                       // scenes: [home tree, branch, sub-branch, ...]
let busy = false, wantDepth = 0, hist = 0, afterSettle = null, tabStart = 0;
const SEG = 13, G = 0.32, DAMP = 0.98, ITER = 6, STIFF = 0.014, K = 0.07;
let mx = -1e4, my = -1e4, lx = null, ly = null, mvx = 0, mvy = 0, gust = 0;
const top = () => stack[stack.length - 1];

/* home tree: a trunk that stands inside the frame and forks into limbs arching to the left, so the
   bottom-left stays free for your name. Everything is in viewport fractions. Each limb springs
   from the trunk at `at` (0 = foot, 1 = top) and is a cubic Bézier through three more points. */
const TRUNK = [[.99, 1.06], [1.005, .66], [.972, .30]];         // far right: the trunk is partly cut by the screen edge
const trunkPt = t => { const u = 1 - t;
  return { x: (u*u*TRUNK[0][0] + 2*u*t*TRUNK[1][0] + t*t*TRUNK[2][0]) * W,
           y: (u*u*TRUNK[0][1] + 2*u*t*TRUNK[1][1] + t*t*TRUNK[2][1]) * H }; };
const LIMBS = [
  { at: .84, p: [[.96, .10], [.55, -.03], [-.06, .16]], w0: .038, w1: .004, wt: .42 },                      // the main limb
  { at: .78, p: [[.89, .14], [.68,  .08], [.30,  .24]], w0: .024, w1: .003, wt: .22 },
  { at: .95, p: [[.98, .04], [.55, -.07], [-.06, .02]], w0: .022, w1: .003, wt: .30, fill: [.20, .30] },     // along the top edge, its leaves hang shorter
];
/* with `tree: false` the strands hang from invisible lines just above the top edge of the screen */
const CANOPY = [                                       // three layers: long strands at the back, shorter ones in front
  { p: [[-.04, -.05], [.28, -.08], [.66, -.01], [1.04, -.05]], wt: .40 },
  { p: [[-.04, -.03], [.30,  .01], [.70, -.06], [1.04, -.02]], wt: .35, fill: [.28, .34] },
  { p: [[-.04, -.07], [.34, -.03], [.72, -.09], [1.04, -.04]], wt: .25, fill: [.14, .26] },
];
const BOTTOMS        = [.44, .30, .48, .60, .72, .36];   // how far each home tablet hangs (fraction of height); the first ones sit above the name
const BOTTOMS_NARROW = [.50, .30, .56, .40, .62, .36];   // phones
const SUB_BOTTOMS = [.50, .64, .44, .72, .57];

function bez(p, t) {
  const u = 1 - t, a = u*u*u, b = 3*u*u*t, c = 3*u*t*t, d = t*t*t;
  return { x: a*p[0][0] + b*p[1][0] + c*p[2][0] + d*p[3][0],
           y: a*p[0][1] + b*p[1][1] + c*p[2][1] + d*p[3][1] };
}
function sampleLimb(L) { L.s = []; for (let i = 0; i <= 160; i++) L.s.push(bez(L.pa, i / 160)); }

/* ---------- tablets ---------- */
const scrambleChars = 'αβγδεζηθικλμνξοπρστυφχψω';
function scramble(el, final) {
  if (RM) return;
  clearInterval(el._t);
  let f = 0; const total = 14;
  el._t = setInterval(() => {
    f++;
    let out = '';
    for (let i = 0; i < final.length; i++)
      out += (!/[A-Za-z]/.test(final[i]) || i < final.length * f / total)
        ? final[i] : scrambleChars[(Math.random() * scrambleChars.length) | 0];
    el.textContent = out;
    if (f >= total) { clearInterval(el._t); el.textContent = final; }
  }, 32);
}
function fixWidth(a) { a.style.width = ''; a.style.width = a.offsetWidth + 'px'; }   // scramble never changes width

function makeTablet(node, sc, idx) {
  const a = document.createElement('a');
  a.className = 'tablet'; a.href = node.href; a.setAttribute('aria-label', node.label);
  if (node.external) { a.target = '_blank'; a.rel = 'noopener'; }
  const s = document.createElement('span'); s.className = 'slab'; s.textContent = node.label;
  a.appendChild(s); nav.appendChild(a); fixWidth(a);
  a.addEventListener('pointerenter', () => scramble(s, node.label));
  a.addEventListener('focus', () => { if (a.matches(':focus-visible')) scramble(s, node.label); });
  a.addEventListener('click', e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;     // let "open in new tab" work
    if (busy) { e.preventDefault(); return; }
    if (node.children && sc === top()) { e.preventDefault(); openNode(sc, idx); }
    /* otherwise: follow the link (a page, or the title tablet of an open branch = the full list) */
  });
  return a;
}

/* ---------- scenes ---------- */
function newScene(parent, nodes) {
  return { parent, child: null, nodes, limbs: [], strands: [], cats: [], back: [], front: [],
           e: 0, eT: 0, g: parent ? 0 : 1, gT: 1, focus: { x: 0, y: 0 }, dest: { x: 0, y: 0 },
           focusIdx: -1, branches: null };
}

function makeStrand(ax, ay, len, o = {}) {
  const n = Math.max(4, Math.round(len / SEG) + 1);
  const s = { n, m: n, ax, ay, t: 0, vis: 1, ph: Math.random() * 6.28, back: !!o.back, cat: !!o.cat, rot: 0,
    x: new Float32Array(n), y: new Float32Array(n), px: new Float32Array(n), py: new Float32Array(n),
    lc: new Uint8Array(n), ll: new Float32Array(n), lk: new Float32Array(n * 4) };
  for (let i = 0; i < n; i++) {
    s.x[i] = s.px[i] = ax + (Math.random() - .5) * 2;
    s.y[i] = s.py[i] = ay + i * SEG;
    const r = Math.random();                                   // five greens, from yellow-green to deep
    s.lc[i] = r < .26 ? 0 : r < .50 ? 1 : r < .64 ? 2 : r < .82 ? 3 : 4;
    s.ll[i] = Math.random() < .97 ? (12 + Math.random() * 10) * leafK : 0;
    const a = .38 + Math.random() * .34;                       // how far the leaf leans away from the twig (radians)
    s.lk[i * 4] = Math.cos(a); s.lk[i * 4 + 1] = Math.sin(a); s.lk[i * 4 + 2] = Math.cos(a * 1.25); s.lk[i * 4 + 3] = Math.sin(a * 1.25);
  }
  return s;
}

/* hang filler strands from the limbs, then one long strand + tablet per node.
   Anchors are spaced evenly along each limb, with a random jitter: full, but never a bare stretch. */
function populate(sc, o) {
  const total = sc.limbs.reduce((a, L) => a + L.wt, 0);
  for (const L of sc.limbs) {

/* where the name block sits, so the first tablets can hang above it instead of over it */

                 fill: [.46, .38], crown: clamp(Math.round(W / (W < 700 ? 4 : 6)), 70, 210), catRange, bottoms });

/* ---------- bark ----------

  sc.dest  = { x: clamp(W * .13, 95, 200), y: H * .17 };              // where it flies to (top-left)

  sc.child = child; stack.push(child);

  try { history.pushState({ ec: stack.length - 1 }, ''); hist = stack.length - 1; } catch (e) {}

addEventListener('keydown', e => { if (e.key === 'Escape') goBack(); });
addEventListener('popstate', e => { wantDepth = (e.state && e.state.ec) || 0; hist = wantDepth; });

const Zoom = () => clamp(W / 640, 1.7, 2.1);

    young.moveTo((x[k] + x[k + 1]) / 2, (y[k] + y[k + 1]) / 2);
    for (let i = k + 1; i < m - 1; i++) young.quadraticCurveTo(x[i], y[i], (x[i] + x[i + 1]) / 2, (y[i] + y[i + 1]) / 2);
    young.lineTo(x[m - 1], y[m - 1]);
  }
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = C.twig; ctx.lineWidth = stemW * 1.35; ctx.stroke(old);
  ctx.strokeStyle = C.stem; ctx.lineWidth = stemW;        ctx.stroke(young);

  const P = [new Path2D(), new Path2D(), new Path2D(), new Path2D(), new Path2D()];
  for (const s of list) {
    const { x, y, n, m, lc, ll, lk } = s; if (m < 3) continue;
    const end = Math.min(m - 1, s.cat ? n - 3 : n - 1);
    for (let i = 1; i < end; i++) {
      const L = ll[i]; if (!L) continue;
      const dx = x[i + 1] - x[i - 1], dy = y[i + 1] - y[i - 1], inv = 1 / (Math.sqrt(dx * dx + dy * dy) || 1);
      const ca = dx * inv, sa = dy * inv, k = i * 4, p = P[lc[i]];        // unit direction of the twig here
      lens(p, x[i], y[i], ca * lk[k] - sa * lk[k + 1], sa * lk[k] + ca * lk[k + 1], L * ls);                 // leaf from the node, leaning one way
      if (!half) lens(p, (x[i] + x[i + 1]) * .5, (y[i] + y[i + 1]) * .5,
           ca * lk[k + 2] + sa * lk[k + 3], sa * lk[k + 2] - ca * lk[k + 3], L * .82 * ls);                   // leaf from halfway on, leaning the other: alternate
    }
  }
  for (let c = 0; c < 5; c++) { ctx.globalAlpha = alpha * LEAF_ALPHA[c]; ctx.fillStyle = C.leaves[c]; ctx.fill(P[c]); }
  ctx.globalAlpha = 1;
}

function draw(Ts) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  for (let i = 0; i < stack.length; i++) {
    const sc = stack[i], T = Ts[i];
    if (T.a < .01) continue;
    const gE = sc.parent ? eio(sc.g) : 1;
    if (sc.parent) for (const list of [sc.strands, sc.cats]) for (const s of list) {   // strands grow down after the limb passes
      s.vis = clamp((gE * 1.25 - s.t) * 2.2, 0, 1);
      s.m = s.vis <= 0 ? 0 : Math.max(2, Math.round(s.vis * s.n));
    }
    ctx.setTransform(DPR * T.s, 0, 0, DPR * T.s, DPR * T.tx, DPR * T.ty);
    drawStrands(sc.back,  .45 * T.a, .8, .9, true);
    drawStrands(sc.front, T.a, 1.1, 1);
    drawStrands(sc.cats,  T.a, 2, 1.05);
    if (sc.bare) { /* no tree: nothing to draw here */ }
    else if (sc.branches) { ctx.globalAlpha = T.a; ctx.drawImage(sc.branches, 0, 0, W, H); ctx.globalAlpha = 1; }
    else drawLimbs(ctx, sc, gE, T.a);
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  updateTablets(Ts);
}

function place(s, px, py, rot, scale, alpha, inter) {
  const el = s.el;
  el.style.transform =
    `translate(${px.toFixed(1)}px, ${py.toFixed(1)}px) translateX(-50%) rotate(${rot.toFixed(3)}rad) scale(${scale.toFixed(3)})`;
  alpha = Math.round(alpha * 100) / 100;
  if (alpha !== s._a) { el.style.opacity = alpha; s._a = alpha; }
  if (inter !== s._i) { el.style.pointerEvents = inter ? 'auto' : 'none'; el.inert = !inter; s._i = inter; }
}
function updateTablets(Ts) {
  const n = stack.length;
  const showRoot = tabStart ? clamp((performance.now() - tabStart) / 1400, 0, 1) : 0;
  for (let i = 0; i < n; i++) {
    const sc = stack[i], T = Ts[i], isTop = i === n - 1, isPar = i === n - 2;
    for (const s of sc.cats) {
      const k = s.n, ex = s.x[k - 1], ey = s.y[k - 1];
      s.rot += (-Math.atan2(ex - s.x[k - 3], ey - s.y[k - 3]) - s.rot) * .3;
      if (!isTop && !isPar) { place(s, -999, -999, 0, 1, 0, false); continue; }
      let px = T.s * ex + T.tx, py = T.s * ey + T.ty, rot = s.rot, scale = T.s, alpha, inter;
      if (isTop) {
        alpha = sc.parent ? clamp((s.vis - .85) / .15, 0, 1) : showRoot;
        inter = !busy && alpha >= .99;
      } else {
        const e = eio(sc.e);
        if (s.idx === sc.focusIdx) {           // the clicked tablet: flies to the corner and becomes the branch's title
          px = lerp(px, sc.dest.x, e); py = lerp(py, sc.dest.y, e); rot = lerp(rot, 0, e); scale = 1;
          alpha = 1; inter = !busy && sc.e >= 1;
        } else { alpha = 1 - clamp(e * 3, 0, 1); inter = false; }
      }
      place(s, px, py, rot, scale, alpha, inter);
    }
  }
}

let last = performance.now(), acc = 0;
function frame(now) {
  const ms = Math.min(50, now - last); last = now; acc += ms;
  tween(ms / 1000);
  const Ts = stack.map((_, i) => frameTransform(i));
  const STEP = 1000 / 60; let k = 0;
  while (acc >= STEP && k++ < 3) { stepAll(now / 1000, Ts); acc -= STEP; }
  draw(Ts);
  if (!busy && stack.length - 1 > wantDepth) closeTop();
  requestAnimationFrame(frame);
}

/* ---------- pointer = wind ---------- */
addEventListener('pointermove', e => {
  if (lx !== null) {
    mvx = clamp(mvx * .4 + (e.clientX - lx) * .6, -35, 35);
    mvy = clamp(mvy * .4 + (e.clientY - ly) * .6, -35, 35);
  }
  lx = mx = e.clientX; ly = my = e.clientY;
}, { passive: true });
addEventListener('pointerdown', e => { lx = mx = e.clientX; ly = my = e.clientY; }, { passive: true });
document.documentElement.addEventListener('mouseleave', () => { mx = my = -1e4; lx = ly = null; });
addEventListener('pointerup', e => { if (e.pointerType === 'touch') { mx = my = -1e4; lx = ly = null; } });

/* ---------- sizing ---------- */
function resize(force) {
  const nw = innerWidth, nh = innerHeight;
  const sameShape = nw === W && Math.abs(nh - H) < 120;          // mobile URL bar: don't rebuild
  DPR = Math.min(devicePixelRatio || 1, 2);
  cv.width = nw * DPR; cv.height = nh * DPR;
  cv.style.width = nw + 'px'; cv.style.height = nh + 'px';
  W = nw; H = nh; leafK = clamp(W / 1150, .72, 1.12);
  if (force || !sameShape) buildRoot();
}
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => resize(false), 150); });

/* ---------- typewriter for the tagline ---------- */
async function typeInto(el, text, speed) {
  el.classList.add('typing');
  for (let i = 1; i <= text.length; i++) { el.textContent = text.slice(0, i); await sleep(speed + Math.random() * speed * .6); }
}
async function eraseFrom(el, speed) {
  let s = el.textContent;
  while (s.length) { s = s.slice(0, -1); el.textContent = s; await sleep(speed); }
}
async function typeAll() {                                   // the pitch is already there; only the little phrase is typed
  const l2 = $('#l2'), ph = CONFIG.phrases;
  if (RM) { l2.textContent = ph[ph.length - 1]; return; }
  for (let i = 0; i < ph.length; i++) {
    await typeInto(l2, ph[i], 48);
    if (i === ph.length - 1) break;
    await sleep(900); await eraseFrom(l2, 18);
  }
  l2.classList.remove('typing');
}

/* ---------- icons under the tagline ---------- */
const ICONS = {
  github: '<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>',
  mail: '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>',
  linkedin: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>',
};
function buildLinks() {
  const bar = $('#links');
  for (const l of CONFIG.links) {
    if (!l.href) continue;
    const a = document.createElement('a');
    a.href = l.href; a.title = l.label; a.setAttribute('aria-label', l.label);
    if (l.external) { a.target = '_blank'; a.rel = 'noopener'; }
    a.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[l.icon] || ''}</svg>`;
    bar.appendChild(a);
  }
}
buildLinks();

/* ---------- go ---------- */
async function start() {
  $('#eyebrow').textContent = CONFIG.eyebrow;
  $('#desc').textContent = CONFIG.description;
  $('#l1').textContent = CONFIG.lede;
  await Promise.race([Promise.all([document.fonts.load('600 40px Inter'), document.fonts.load('400 16px Inter')]), sleep(1500)]).catch(() => {});
  readColors();
  resize(true);
  requestAnimationFrame(frame);

  let seen = false;
  try { seen = sessionStorage.getItem('ec-seen') === '1'; } catch (e) {}
  if (RM || seen) {
    cv.classList.add('instant', 'show'); document.body.classList.add('on');
    tabStart = performance.now() - 2000; typeAll(); return;
  }
  await sleep(150);                                            // first visit: the tree fades in on a gust of wind, then the words
  cv.classList.add('show'); gust = 1; document.body.classList.add('on'); tabStart = performance.now();
  setTimeout(typeAll, 900);
  try { sessionStorage.setItem('ec-seen', '1'); } catch (e) {}
}
document.fonts.ready.then(() => document.querySelectorAll('.tablet').forEach(fixWidth));
start();
})();
</script>
